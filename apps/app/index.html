  <head>
    <meta charset="UTF-8" />

    <link rel="preconnect" href="https://a.tile.openstreetmap.org" />
    <link rel="preconnect" href="https://b.tile.openstreetmap.org" />

    <meta

      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Dividi carburante e pedaggi tra i passeggeri e condividi il riepilogo del viaggio con un link."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Riparti" />

      content="Dividi carburante e pedaggi tra i passeggeri e condividi il riepilogo del viaggio con un link."
    />
    <meta property="og:locale" content="it_IT" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Riparti — Dividi carburante e pedaggi" />
    <meta
      name="twitter:description"
      content="Dividi carburante e pedaggi tra i passeggeri e condividi il riepilogo del viaggio con un link."
    />
    <script>
      // Apply the saved or system theme before the first paint
      try {
        const stored = localStorage.getItem('backseat.theme')
        const dark =
          stored === 'dark' ||
          (stored !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch {
        // Storage can be unavailable; the app applies the system theme
      }
    </script>
    <title>Riparti — Dividi carburante e pedaggi</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
